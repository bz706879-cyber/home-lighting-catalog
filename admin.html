<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>商品管理</title><link rel="stylesheet" href="admin.css"></head><body><aside><h1>商品管理</h1><p>静态数据管理工具</p><button id="new">＋ 新增商品</button><button id="import">导入 data.json</button><button id="export">导出更新数据</button><input id="file" type="file" accept="application/json" hidden><a href="index.html">返回前台</a></aside><main><header><input id="q" placeholder="搜索商品名称、编号或分类"><select id="filter"><option>全部</option><option>家具</option><option>照明</option><option>已下架</option></select></header><div id="summary"></div><div class="table"><table><thead><tr><th>商品</th><th>编号</th><th>类别</th><th>价格</th><th>状态</th><th>操作</th></tr></thead><tbody></tbody></table></div></main><dialog><form method="dialog"><button class="x">×</button><h2>编辑商品</h2><input name="id" placeholder="商品编号" required><input name="name" placeholder="商品名称" required><input name="category" placeholder="所属分类"><select name="type"><option>家具</option><option>照明</option></select><input name="spec" placeholder="规格"><input name="material" placeholder="材质"><input name="price" placeholder="价格"><label><input name="active" type="checkbox" checked> 上架展示</label><label>图片路径（每行一张）<textarea name="images" rows="6"></textarea></label><menu><button value="cancel">取消</button><button id="save" value="default">保存</button></menu></form></dialog><script src="admin.js"></script></body></html>
